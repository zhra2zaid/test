<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Data</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f4f5f7;margin:0;color:#1f2937}
  main{max-width:720px;margin:40px auto;padding:0 16px}
  h1{margin-bottom:16px}
  form,table{background:#fff;border-radius:10px;box-shadow:0 1px 3px #0002}
  form{display:flex;gap:8px;padding:16px;flex-wrap:wrap}
  input,select,button{font:inherit;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px}
  input{flex:1;min-width:180px}
  button{background:#2563eb;color:#fff;border:0;cursor:pointer}
  table{width:100%;border-collapse:collapse;margin-top:16px;overflow:hidden}
  th,td{text-align:left;padding:10px 14px;border-bottom:1px solid #eee}
  .pill{padding:2px 10px;border-radius:999px;font-size:13px;color:#fff}
  .Pass{background:#16a34a}.Fail{background:#dc2626}.Skipped{background:#6b7280}.Other{background:#d97706}
  .del{background:none;color:#dc2626;padding:2px 8px}
  .empty{padding:20px;text-align:center;color:#6b7280}
</style>
</head>
<body>
<main>
  <h1>Test Data</h1>
  <form id="f">
    <input id="name" placeholder="Test name" required>
    <select id="result"><option>Pass</option><option>Fail</option><option>Skipped</option></select>
    <button>Add</button>
  </form>
  <table>
    <thead><tr><th>Test name</th><th>Result</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const rows = document.getElementById('rows');
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function load() {
  const data = await (await fetch('/api/tests')).json();
  rows.innerHTML = data.length ? data.map((r) =>
    `<tr><td>${esc(r.name)}</td><td><span class="pill ${['Pass','Fail','Skipped'].includes(r.result)?r.result:'Other'}">${esc(r.result)}</span></td><td><button class="del" data-id="${r.id}">Delete</button></td></tr>`
  ).join('') : '<tr><td colspan="3" class="empty">No tests yet</td></tr>';
}
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const name = document.getElementById('name');
  await fetch('/api/tests', { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: name.value, result: document.getElementById('result').value }) });
  name.value = '';
  load();
});
rows.addEventListener('click', async (e) => {
  const id = e.target.dataset.id;
  if (id) { await fetch('/api/tests/' + id, { method: 'DELETE' }); load(); }
});
load();
</script>
</body>
</html>
